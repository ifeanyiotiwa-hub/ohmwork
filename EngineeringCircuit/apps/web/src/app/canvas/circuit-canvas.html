<svg
	#svg
	class="canvas"
	role="application"
	aria-label="Circuit canvas"
	[attr.viewBox]="viewBox()"
	[class.paused]="store.paused()"
	[class.placing]="store.placing() !== undefined"
	[class.wiring]="store.wiringFrom() !== undefined"
	[style.--flow-period.px]="config.flow.dashPeriod"
	(pointerdown)="onBackgroundDown($event)"
	(pointermove)="onPointerMove($event)"
	(pointerup)="onPointerUp($event)"
	(pointercancel)="onPointerUp($event)"
	(wheel)="onWheel($event)"
>
	<defs>
		<pattern id="grid-dots" patternUnits="userSpaceOnUse" [attr.width]="config.gridSize" [attr.height]="config.gridSize">
			<circle class="grid-dot" cx="0" cy="0" r="1" />
		</pattern>
	</defs>
	<rect class="grid" x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid-dots)" />

	@for (wire of wires(); track wire.id) {
		<g
			class="wire"
			role="button"
			tabindex="0"
			[class.selected]="wire.selected"
			[class.agent-changed]="wire.agentChanged"
			[attr.data-wire]="wire.id"
			[attr.aria-label]="wire.label"
			(pointerdown)="onWireDown($event, wire.id)"
			(pointerenter)="$event.pointerType === 'mouse' && hover({ kind: 'wire', id: wire.id })"
			(pointerleave)="$event.pointerType === 'mouse' && hover(undefined)"
			(keydown)="onWireKey($event, wire.id)"
		>
			<path class="wire-hit" [attr.d]="wire.path" />
			<path class="wire-line" [attr.d]="wire.path" [style.stroke]="wire.colour" />
			@if (wire.flow; as flow) {
				<path class="wire-flow" [class.reverse]="flow.reverse" [attr.d]="wire.path" [style.animation-duration.s]="flow.seconds" />
			}
		</g>
	}

	@for (item of parts(); track item.part.id) {
		<g
			class="part"
			role="button"
			tabindex="0"
			[class.selected]="item.selected"
			[class.agent-changed]="item.agentChanged"
			[class.junction]="item.part.type === 'junction'"
			[class.overheated]="item.overheated"
			[attr.data-part]="item.part.id"
			[attr.aria-label]="item.part.id + ' ' + item.value"
			[attr.transform]="item.transform"
			(pointerdown)="onPartDown($event, item.part)"
			(keydown)="onPartKey($event, item.part)"
			(keyup)="onPartKeyUp($event, item.part)"
		>
			<rect
				class="part-hit"
				[attr.x]="item.body.left"
				[attr.y]="item.body.top - 2"
				[attr.width]="item.body.right - item.body.left"
				[attr.height]="item.body.bottom - item.body.top + 4"
				[attr.transform]="item.rotation"
			/>
			@if (item.glow; as glow) {
				<circle class="glow" r="12" [attr.opacity]="glow.strength" [style.fill]="glow.colour" [style.--glow-colour]="glow.colour" />
			}
			<g [attr.transform]="item.rotation">
				@for (d of item.paths; track $index) {
					<path class="symbol" [attr.d]="d" />
				}
				@if (item.lever; as lever) {
					<path class="symbol" [attr.d]="lever" />
				}
				@for (plate of item.plates; track plate.pin) {
					<path class="plate" [attr.data-plate]="plate.pin" [attr.d]="plate.d" [style.stroke]="plate.colour" />
				}
				@if (item.wiper; as wiper) {
					<path class="symbol" [attr.d]="wiper.d" />
					<circle class="wiper-hit" data-wiper r="9" [attr.cx]="wiper.x" [attr.cy]="wiper.y" (pointerdown)="onWiperDown($event, item.part.id)" />
				}
				@if (item.rotor; as rotor) {
					<g
						class="rotor"
						data-rotor
						[class.spinning]="rotor.spin"
						[class.reverse]="rotor.spin?.reverse"
						[style.animation-duration.s]="rotor.spin?.seconds"
					>
						<path class="symbol" [attr.d]="rotor.d" />
					</g>
				}
				@for (segment of item.segments; track segment.pin) {
					<path class="segment" [class.lit]="segment.lit" [attr.d]="segment.d" [attr.data-segment]="segment.pin" />
				}
			</g>
			@if (item.overheated) {
				<!-- Too much current or heat: a puff of smoke rises from the part. -->
				<g class="smoke" data-smoke>
					<circle class="puff" cx="-6" cy="-20" r="5" />
					<circle class="puff" cx="4" cy="-24" r="6" />
					<circle class="puff" cx="0" cy="-30" r="4" />
				</g>
			}
		</g>
		@for (mark of item.marks; track $index) {
			<text class="polarity" [attr.x]="mark.x" [attr.y]="mark.y">{{ mark.text }}</text>
		}
		<text class="part-label" [attr.x]="item.label.x" [attr.y]="item.label.y" [attr.text-anchor]="item.label.anchor">
			<tspan class="part-name">{{ item.part.id }}</tspan> {{ item.value }}
		</text>
		@if (item.reading; as reading) {
			<text class="part-reading" [class.meter-reading]="item.meter" [attr.x]="item.readingAt.x" [attr.y]="item.readingAt.y" [attr.text-anchor]="item.readingAt.anchor">{{ reading }}</text>
		}
	}

	@for (note of notes(); track note.id) {
		<g
			class="note"
			role="button"
			tabindex="0"
			[class.selected]="note.selected"
			[attr.data-note]="note.id"
			[attr.aria-label]="'Note: ' + note.lines.join(' ')"
			[attr.transform]="note.transform"
			(pointerdown)="onNoteDown($event, note.id)"
			(keydown)="onNoteKey($event, note.id)"
		>
			<rect class="note-box" [attr.width]="note.width" [attr.height]="note.height" rx="4" />
			<text class="note-text">
				@for (line of note.lines; track $index) {
					<tspan [attr.x]="notePadding" [attr.y]="notePadding + noteLineHeight * ($index + 1) - 4">{{ line }}</tspan>
				}
			</text>
		</g>
	}

	@for (label of nodeLabels(); track label.key) {
		<text class="node-label" [attr.x]="label.x" [attr.y]="label.y">{{ label.text }}</text>
	}

	@for (item of parts(); track item.part.id) {
		@for (pin of item.pins; track pin.key) {
			<circle
				class="pin-hit"
				[attr.r]="pinHitRadius"
				[attr.cx]="pin.at.x"
				[attr.cy]="pin.at.y"
				(pointerdown)="onPinDown($event, pin.ref)"
				(pointerenter)="$event.pointerType === 'mouse' && hover({ kind: 'pin', ref: pin.ref })"
				(pointerleave)="$event.pointerType === 'mouse' && hover(undefined)"
			/>
			<!-- Reached from its part with P (not Tab: every pin a tab stop would bury the parts), then arrows; Enter wires. -->
			<circle
				class="pin"
				role="button"
				tabindex="-1"
				[attr.aria-label]="pin.ref.componentId + ' pin ' + pin.ref.pin"
				[attr.r]="config.pinRadius"
				[class.pending]="pin.pending"
				[attr.cx]="pin.at.x"
				[attr.cy]="pin.at.y"
				[attr.data-pin]="pin.key"
				(pointerdown)="onPinDown($event, pin.ref)"
				(keydown)="onPinKey($event, item.part.id, item.pins, $index)"
				(pointerenter)="$event.pointerType === 'mouse' && hover({ kind: 'pin', ref: pin.ref })"
				(pointerleave)="$event.pointerType === 'mouse' && hover(undefined)"
			/>
		}
	}

	@if (readout(); as info) {
		<g class="readout" data-readout [attr.transform]="info.transform">
			<rect class="readout-box" [attr.width]="info.width" [attr.height]="info.height" rx="4" />
			<text class="readout-text" [attr.x]="info.padding" [attr.y]="info.height / 2" dominant-baseline="central">{{ info.text }}</text>
		</g>
	}

	@if (dial(); as knob) {
		<g class="dial" data-dial [attr.transform]="knob.transform">
			<g class="dial-knob" data-dial-knob (pointerdown)="onDialDown($event, knob.componentId)" (wheel)="onDialWheel($event, knob.componentId)">
				<circle class="dial-face" r="16" />
				<line class="dial-pointer" x1="0" y1="-3" x2="0" y2="-13" [attr.transform]="knob.pointer" />
			</g>
			<g
				class="dial-button"
				role="button"
				tabindex="0"
				transform="translate(-14 32)"
				[attr.aria-label]="'Decrease ' + knob.componentId + ' ' + knob.param"
				(pointerdown)="$event.stopPropagation()"
				(click)="nudge(knob.componentId, -1)"
				(keydown.enter)="nudge(knob.componentId, -1)"
			>
				<circle r="10" />
				<text text-anchor="middle" dominant-baseline="central">−</text>
			</g>
			<g
				class="dial-button"
				role="button"
				tabindex="0"
				transform="translate(14 32)"
				[attr.aria-label]="'Increase ' + knob.componentId + ' ' + knob.param"
				(pointerdown)="$event.stopPropagation()"
				(click)="nudge(knob.componentId, 1)"
				(keydown.enter)="nudge(knob.componentId, 1)"
			>
				<circle r="10" />
				<text text-anchor="middle" dominant-baseline="central">+</text>
			</g>
		</g>
	}

	@if (selectionBox(); as box) {
		<rect class="selection-box" [attr.x]="box.x" [attr.y]="box.y" [attr.width]="box.width" [attr.height]="box.height" />
	}

	@if (rubberBand(); as band) {
		<line class="rubber-band" [attr.x1]="band.x1" [attr.y1]="band.y1" [attr.x2]="band.x2" [attr.y2]="band.y2" />
	}
</svg>
