<nav class="palette" aria-label="Parts">
	<div class="categories" role="tablist" aria-label="Part categories">
		@for (category of categories(); track category.name; let index = $index) {
			<button
				type="button"
				role="tab"
				class="category"
				[id]="'palette-tab-' + category.name"
				aria-controls="palette-parts"
				[class.current]="category.name === currentCategory()"
				[attr.aria-selected]="category.name === currentCategory()"
				[attr.tabindex]="category.name === currentCategory() ? 0 : -1"
				[attr.data-category]="category.name"
				[attr.data-types]="category.typeList"
				(click)="currentCategory.set(category.name)"
				(keydown)="onCategoryKey($event, index)"
			>
				{{ category.name }}
			</button>
		}
	</div>
	<div class="parts" role="tabpanel" id="palette-parts" [attr.aria-labelledby]="'palette-tab-' + currentCategory()">
		@for (item of items(); track item.key; let index = $index) {
			<button
				type="button"
				class="part-button"
				(keydown)="onPartKey($event, index)"
				[class.active]="isActive(item)"
				[attr.aria-pressed]="isActive(item)"
				[attr.data-palette]="item.key"
				[title]="item.simulated ? 'Add ' + item.name : item.name + ' (shown, not simulated yet)'"
				(click)="choose.emit(item.placing)"
			>
				<svg class="icon" [attr.viewBox]="item.viewBox" aria-hidden="true">
					@for (d of item.paths; track $index) {
						<path [attr.d]="d" />
					}
					@for (mark of item.marks; track $index) {
						<text class="mark" [attr.x]="mark.at.x" [attr.y]="mark.at.y">{{ mark.text }}</text>
					}
				</svg>
				<span class="name">{{ item.name }}</span>
				@if (!item.simulated) {
					<span class="badge">soon</span>
				}
			</button>
		}
		@if (currentCategory() === chipsCategory && items().length === 0) {
			<p class="hint" data-chips-hint>Select parts, then Make chip in the inspector: it becomes a part you can place again.</p>
		}
	</div>
</nav>
