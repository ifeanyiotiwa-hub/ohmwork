<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- The app icon for shaped launchers: full bleed, the monogram at 80% about the middle, inside the safe zone. -->
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18212b"/><stop offset="1" stop-color="#0c1116"/></linearGradient>
		<clipPath id="tile-shape"><rect width="64" height="64"/></clipPath>
		<!-- The parts are cut away around the letters, so nothing is painted behind them. -->
		<mask id="around-letters" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><g fill="none" stroke="#000" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><circle cx="19" cy="32" r="10.5"/><path d="M29.5 32 H33 L37 20 L42 44 L47 20 L51 32 H56"/></g></mask>
	</defs>
	<rect width="64" height="64" fill="url(#tile)"/>
	<g transform="translate(32 32) scale(0.8) translate(-32 -32)">
		<g fill="none" stroke="#93a1af" stroke-linecap="round" stroke-linejoin="round">
			<g mask="url(#around-letters)">
				<path transform="translate(22 61) rotate(-8) scale(0.75)" d="M-7 0 H-3 M-3 0 L3.5 -3.5 M3 0 H7" stroke-width="2.27" opacity="0.17"/>
				<path transform="translate(2.5 33) rotate(90) scale(0.8)" d="M-8 0 H-5 L-3.5 -3 L-1 3 L1.5 -3 L4 3 L5.5 0 H8" stroke-width="2.13" opacity="0.17"/>
				<path transform="translate(9 8) rotate(-24) scale(1.15)" d="M-8 0 H-5 L-3.5 -3 L-1 3 L1.5 -3 L4 3 L5.5 0 H8" stroke-width="1.48" opacity="0.4"/>
				<path transform="translate(29 6.5) rotate(12) scale(0.85)" d="M-6 0 H-1.5 M-1.5 -4 V4 M1.5 -4 V4 M1.5 0 H6" stroke-width="2.00" opacity="0.4"/>
				<path transform="translate(53 11) rotate(18) scale(0.95)" d="M0 -5 V-1 M-5 -1 H5 M-3 1.5 H3 M-1 4 H1" stroke-width="1.79" opacity="0.4"/>
				<path transform="translate(11 57) rotate(14) scale(1.05)" d="M-9 0 H-7 A2.4 2.4 0 0 1 -2.2 0 A2.4 2.4 0 0 1 2.6 0 A2.4 2.4 0 0 1 7.4 0 H9" stroke-width="1.62" opacity="0.4"/>
				<path transform="translate(39 58.5) rotate(-18) scale(0.9)" d="M-7 0 H-3 M-3 -3.5 L3 0 L-3 3.5 Z M3 -3.5 V3.5 M3 0 H7" stroke-width="1.89" opacity="0.4"/>
				<path transform="translate(61 52) rotate(-30) scale(1.1)" d="M-6 0 H-1.5 M-1.5 -5 V5 M1.5 -2.5 V2.5 M1.5 0 H6" stroke-width="1.55" opacity="0.4"/>
			</g>
		</g>
		<circle cx="19" cy="32" r="10.5" fill="none" stroke="#4cc2ff" stroke-width="5"/>
		<path d="M29.5 32 H33 L37 20 L42 44 L47 20 L51 32 H56" fill="none" stroke="#7ee2a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="56" cy="32" r="3.6" fill="#ffd166"/>
	</g>
</svg>
