# The web app on GitHub Pages. Every push to develop (the published branch) is tested in full (unit, browser, offline
# production build) and only then built for the site's address and deployed. The base path comes from Pages itself
# (/<repo>/ for a project site).
name: Web app (GitHub Pages)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: OhmWork
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: OhmWork/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Types and production build
        run: pnpm typecheck

      - name: Browser for the browser tests
        working-directory: OhmWork/apps/web
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: OhmWork/apps/web
        run: npx playwright test --workers=2

      - name: Offline test of the production build
        working-directory: OhmWork/apps/web
        run: npx playwright test -c playwright.offline.config.ts

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build for the site's address
        working-directory: OhmWork/apps/web
        run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: OhmWork/apps/web/dist/web/browser

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: OhmWork/apps/web/test-results
          retention-days: 7

  deploy:
    needs: test-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
